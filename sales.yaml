domain: sales
description: Sales performance, revenue, pipeline and monetization analytics
keywords: [revenue, mrr, arr, churn, pipeline, deals, quota, conversion, sales, customers, billing, subscription, recurring]
metrics:
  - name: Monthly Recurring Revenue (MRR)
    definition: Total recurring revenue normalized to a monthly value
  - name: Annual Recurring Revenue (ARR)
    definition: MRR multiplied by 12 - annualized view of recurring revenue
  - name: Churn Rate
    definition: Percentage of customers or revenue lost in a given period
  - name: Lead Conversion Rate
    definition: Percentage of leads that become paying customers
  - name: Sales Pipeline Value
    definition: Total value of all active deals currently in the pipeline
  - name: Average Contract Value (ACV)
    definition: Average revenue per customer contract per year
sample_qa:
  - q: What is our current MRR?
    a: Query the revenue table filtering by current month and recurring transaction types. Sum all active subscription charges.
  - q: Why did churn increase last quarter?
    a: Analyze cancellation reasons by segment. Break down by plan type, customer tenure, and product usage before cancellation.
  - q: Which customer segment has the highest conversion rate?
    a: Group leads by segment (SMB, Mid-Market, Enterprise) and calculate conversions divided by total leads per segment.
  - q: How is our pipeline trending?
    a: Compare pipeline value week over week. Look at deals created, deals closed, and average deal age by stage.
